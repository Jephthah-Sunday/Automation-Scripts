name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [cypress, playwright]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm i

      - name: Set default env
        run: |
          echo "BASE_URL=https://www.saucedemo.com" >> $GITHUB_ENV
          echo "DEMO_USERNAME=standard_user" >> $GITHUB_ENV
          echo "DEMO_PASSWORD=secret_sauce" >> $GITHUB_ENV

      - name: Install Playwright browsers
        if: matrix.framework == 'playwright'
        run: npm run -w e2e-playwright install-browsers

      - name: Run Cypress
        if: matrix.framework == 'cypress'
        run: npm run -w e2e-cypress test

      - name: Upload Cypress report
        if: matrix.framework == 'cypress'
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: packages/e2e-cypress/mochawesome-report

      - name: Run Playwright
        if: matrix.framework == 'playwright'
        run: npm run -w e2e-playwright test

      - name: Upload Playwright report
        if: matrix.framework == 'playwright'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e-playwright/playwright-report
